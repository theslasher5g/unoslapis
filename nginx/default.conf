# Welcher Hostname -> welcher Ordner in ./sites
map $host $site {
    default         dashboard;
    ~^dating\.      dating;
    ~^overwatch\.   overwatch;
    ~^b-day\.       b-day;
    ~^goon\.        goon;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html/$site;
    index index.html;

    # Gemeinsame Styles/Scripts für alle Subdomains
    location /shared/ {
        alias /usr/share/nginx/html/shared/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /shared/404.html;
}
