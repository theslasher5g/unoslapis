# Welcher Hostname -> welcher Ordner in ./sites
map $host $site {
    default         dashboard;
    ~^dating\.      dating;
    ~^overwatch\.   overwatch;
    ~^b-day\.       b-day;
    ~^goon\.        goon;
    ~^girlfriend\.  girlfriend;
    ~^linkedin\.    linkedin;
    ~^nofap\.       nofap;
    ~^guestbook\.   guestbook;
    ~^touchgrass\.  touchgrass;
    ~^waifu\.       waifu;
    ~^quotes\.      quotes;
    ~^news\.        news;
    ~^excuses\.     excuses;
    ~^horoskop\.    horoskop;
    ~^merch\.       merch;
    ~^discord\.     discord;
    ~^wordle\.      wordle;
    ~^tinder\.      tinder;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html/$site;
    index index.html;

    # Gemeinsame Styles/Scripts für alle Subdomains
    location /shared/ {
        alias /usr/share/nginx/html/shared/;
        # immer beim Server nachfragen (billig dank ETag), damit Updates sofort ankommen
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /shared/404.html;
}
