<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gästebuch – Big H</title>
<meta name="description" content="Das offizielle Gästebuch von Big H. Hinterlass ihm eine Nachricht.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2322d3ee'/><text x='50' y='70' font-size='62' font-family='Arial' font-weight='700' text-anchor='middle' fill='%230a0a0c'>H</text></svg>">
<link rel="stylesheet" href="/shared/style.css">
<style>
  :root { --accent: #22d3ee; }
  body { background: radial-gradient(700px 360px at 50% -80px, rgba(34,211,238,.08), transparent 70%), var(--bg); }
  .wrap { width: min(720px, 100% - 32px); }
  .page-head { text-align: center; }
  .page-head p { margin-inline: auto; }

  .compose { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(18px, 4vw, 26px); }
  .compose label { display: block; font: 600 .82rem var(--body); color: var(--muted); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input[type=text], textarea { width: 100%; border: 1px solid var(--line-2); background: var(--card-2); padding: 11px 14px; font: 500 1rem var(--body); color: var(--text); border-radius: 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
  textarea { min-height: 110px; resize: vertical; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .count { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .btn.send { background: var(--accent); color: #0a0a0c; }
  .msg { margin-top: 12px; font-size: .92rem; min-height: 1.3em; }
  .msg.err { color: #fb7185; }
  .msg.ok { color: var(--green); }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 40px 0 12px; }
  .list-head h2 { font: 600 1.3rem var(--title); margin: 0; }
  .list-head span { color: var(--muted); font-size: .9rem; }
  .entries { display: flex; flex-direction: column; gap: 10px; }
  .entry { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .entry .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--title); color: #fff; }
  .entry .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry .n { font-weight: 600; }
  .entry .when { font-size: .8rem; color: var(--muted); }
  .entry .text { margin-top: 4px; white-space: pre-line; overflow-wrap: anywhere; line-height: 1.5; }
  .entry .del { position: absolute; top: 12px; right: 12px; background: none; border: 1px solid var(--line-2); color: var(--muted); border-radius: 8px; padding: 4px; cursor: pointer; display: grid; }
  .entry .del:hover { color: #fb7185; border-color: #fb7185; }
  .empty { text-align: center; color: var(--muted); padding: 28px; background: var(--card); border: 1px dashed var(--line-2); border-radius: 16px; }
</style>
</head>
<body data-back>
  <main class="wrap">
    <header class="page-head">
      <span class="kicker"><i data-icon="book-open"></i>Gästebuch</span>
      <h1>Schreib Big H etwas</h1>
      <p>Zum Geburtstag, als Liebeserklärung oder einfach als Erinnerung, dass er Gras anfassen soll. Jeder Eintrag wird gespeichert.</p>
    </header>

    <section class="compose">
      <form id="form" novalidate>
        <div class="field">
          <label for="name">Dein Name</label>
          <input type="text" id="name" maxlength="30" autocomplete="nickname" placeholder="z.B. Mausi die Katze" required>
        </div>
        <div class="field">
          <label for="message">Deine Nachricht</label>
          <textarea id="message" maxlength="500" placeholder="Big H, du bist der Beste …" required></textarea>
        </div>
        <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
        <div class="row">
          <span class="count" id="count">0 / 500</span>
          <button class="btn send" type="submit" id="submit"><i data-icon="send"></i>Eintragen</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </section>

    <div class="list-head"><h2>Einträge</h2><span id="total"></span></div>
    <section class="entries" id="entries"><div class="empty">Lade Einträge …</div></section>
  </main>

  <footer class="bigh-footer">Gästebuch von Big H · guestbook.unoslapis.ch</footer>

  <script src="/shared/fun.js"></script>
  <script>
  (function () {
    'use strict';

    const API = '/api/entries';
    const isAdmin = location.hash === '#admin';
    const COLORS = ['#0891b2', '#db2777', '#7c3aed', '#059669', '#d97706', '#2563eb', '#dc2626'];
    const colorFor = (name) => COLORS[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COLORS.length];

    const msgEl = document.getElementById('msg');
    const count = document.getElementById('count');
    const message = document.getElementById('message');
    message.addEventListener('input', () => { count.textContent = message.value.length + ' / 500'; });

    function setMsg(text, ok) { msgEl.textContent = text; msgEl.className = 'msg ' + (ok ? 'ok' : 'err'); }

    function when(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' +
        d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
    }

    const list = document.getElementById('entries');
    function render(entries) {
      list.innerHTML = '';
      if (!entries.length) {
        list.innerHTML = '<div class="empty">Noch keine Einträge. Sei der Erste.</div>';
        return;
      }
      entries.forEach((en) => {
        const d = document.createElement('article');
        d.className = 'entry';
        d.innerHTML = '<div class="av"></div><div><div class="who"><span class="n"></span><span class="when"></span></div><div class="text"></div></div>';
        const av = d.querySelector('.av');
        av.textContent = ([...en.name.trim()][0] || '?').toUpperCase();
        av.style.background = colorFor(en.name);
        d.querySelector('.n').textContent = en.name;
        d.querySelector('.when').textContent = when(en.ts);
        d.querySelector('.text').textContent = en.message;
        if (isAdmin) {
          const b = document.createElement('button');
          b.className = 'del';
          b.type = 'button';
          b.title = 'Löschen';
          b.innerHTML = BIGH.icon('x');
          b.addEventListener('click', () => del(en.id, d));
          d.appendChild(b);
        }
        list.appendChild(d);
      });
    }

    async function load() {
      try {
        const r = await fetch(API, { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        render(data.entries || []);
        const total = data.total || 0;
        document.getElementById('total').textContent = total + (total === 1 ? ' Eintrag' : ' Einträge');
      } catch (e) {
        list.innerHTML = '<div class="empty">Der Gästebuch-Server antwortet gerade nicht. Versuch es später nochmal.</div>';
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const text = message.value.trim();
      if (!name) { setMsg('Bitte gib einen Namen ein.', false); return; }
      if (text.length < 2) { setMsg('Schreib wenigstens ein paar Worte.', false); return; }
      const btn = document.getElementById('submit');
      btn.disabled = true;
      setMsg('Wird gesendet …', true);
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, message: text, website: document.getElementById('website').value })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Fehler ' + r.status);
        setMsg('Danke für deinen Eintrag. Big H ist gerührt.', true);
        message.value = '';
        count.textContent = '0 / 500';
        BIGH.confettiRain(null, 40);
        load();
      } catch (err) {
        setMsg(err.message === 'Failed to fetch' ? 'Server nicht erreichbar.' : err.message, false);
      } finally {
        btn.disabled = false;
      }
    });

    // Admin: guestbook.unoslapis.ch/#admin -> Löschknöpfe (Token aus .env)
    async function del(id, el) {
      let token = '';
      try { token = sessionStorage.getItem('bigh-gb-token') || ''; } catch (e) { /* egal */ }
      if (!token) {
        token = prompt('Admin-Token:') || '';
        if (!token) return;
      }
      if (!confirm('Eintrag wirklich löschen?')) return;
      const r = await fetch(API + '/' + encodeURIComponent(id), { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } });
      if (r.ok) {
        try { sessionStorage.setItem('bigh-gb-token', token); } catch (e) { /* egal */ }
        el.remove();
        BIGH.toast('Gelöscht');
      } else {
        try { sessionStorage.removeItem('bigh-gb-token'); } catch (e) { /* egal */ }
        BIGH.toast('Löschen fehlgeschlagen (' + r.status + ')');
      }
    }

    load();
    setInterval(() => { if (!document.hidden) load(); }, 60000);
  })();
  </script>
</body>
</html>
